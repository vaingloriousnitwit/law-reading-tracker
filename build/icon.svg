<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26417a" />
      <stop offset="100%" stop-color="#3a5ba0" />
    </linearGradient>
    <linearGradient id="pageShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef1f7" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)" />

  <g transform="translate(512 512) scale(1.28) translate(-512 -512)">
    <!-- bookmark ribbon, tucked behind the book spine -->
    <path d="M 486 212 L 566 212 L 566 492 L 526 452 L 486 492 Z" fill="#e0a53a" />

    <!-- open book -->
    <path
      d="M 512 616
         C 512 500, 470 452, 288 430
         L 288 560
         C 470 582, 512 630, 512 616
         Z"
      fill="url(#pageShade)"
    />
    <path
      d="M 512 616
         C 512 500, 554 452, 736 430
         L 736 560
         C 554 582, 512 630, 512 616
         Z"
      fill="url(#pageShade)"
    />

    <!-- spine shadow -->
    <path d="M 512 616 C 512 500, 512 470, 512 430 L 512 560 C 512 590, 512 610, 512 616 Z" fill="#c7cede" opacity="0.6" />

    <!-- text lines on left page -->
    <line x1="330" y1="470" x2="470" y2="486" stroke="#71829e" stroke-width="10" stroke-linecap="round" />
    <line x1="330" y1="500" x2="470" y2="514" stroke="#71829e" stroke-width="10" stroke-linecap="round" />
    <line x1="330" y1="530" x2="470" y2="542" stroke="#71829e" stroke-width="10" stroke-linecap="round" />

    <!-- text lines on right page -->
    <line x1="694" y1="470" x2="554" y2="486" stroke="#71829e" stroke-width="10" stroke-linecap="round" />
    <line x1="694" y1="500" x2="554" y2="514" stroke="#71829e" stroke-width="10" stroke-linecap="round" />
    <line x1="694" y1="530" x2="554" y2="542" stroke="#71829e" stroke-width="10" stroke-linecap="round" />

    <!-- book cover base shadow for grounding -->
    <ellipse cx="512" cy="646" rx="230" ry="18" fill="#000000" opacity="0.1" />
  </g>
</svg>
