<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#2b2f38" />
      <stop offset="45%" stop-color="#16171c" />
      <stop offset="100%" stop-color="#07080a" />
    </radialGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c065" />
      <stop offset="100%" stop-color="#c98f2e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)" />
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)" />

  <g transform="translate(512 512) scale(1.3) translate(-512 -512)">
    <!-- bookmark ribbon, slim gold accent -->
    <path d="M 496 210 L 550 210 L 550 486 L 523 456 L 496 486 Z" fill="url(#ribbon)" />

    <!-- open book, minimal line art -->
    <path
      d="M 512 616
         C 512 500, 470 452, 288 430
         L 288 560
         C 470 582, 512 630, 512 616
         Z"
      fill="none"
      stroke="#ffffff"
      stroke-width="26"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <path
      d="M 512 616
         C 512 500, 554 452, 736 430
         L 736 560
         C 554 582, 512 630, 512 616
         Z"
      fill="none"
      stroke="#ffffff"
      stroke-width="26"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- spine line -->
    <line x1="512" y1="430" x2="512" y2="616" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.9" />

    <!-- soft grounding shadow -->
    <ellipse cx="512" cy="640" rx="230" ry="16" fill="#000000" opacity="0.35" />
  </g>
</svg>
