name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a class with pages set to...
        2. Log pages read...
        3. See error / wrong value
    validations:
      required: true

  - type: dropdown
    id: how-run
    attributes:
      label: How are you running the app?
      options:
        - Packaged .app / .dmg
        - From source (npm start)
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.1 (Sequoia)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version (only if running from source)
      placeholder: e.g. v20.11.0

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, error messages from the DevTools console (Cmd+Option+I), or anything else that might help.
